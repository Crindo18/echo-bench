[project]
name = "echo-benchmark"
version = "0.1.0"
description = "ECHO encoder benchmark: train, quantize, and compare edge speech encoders (Conformer, E-Branchformer, Zipformer, Moonshine, DPWavLM) for atypical/dysarthric speech."
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds only; the exact tested versions are pinned in requirements.txt.
# Install torch/torchaudio for your platform (CPU or CUDA) from https://pytorch.org.
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "PyYAML>=6.0",
    # soundfile is REQUIRED: audio (LibriSpeech FLAC + TORGO WAV) is loaded via
    # soundfile/libsndfile, not torchaudio.load, so a torchaudio that routes
    # load() through TorchCodec does not require installing `torchcodec`.
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Optional upstream/official encoders. The reimplementation encoders and the
# whole pipeline work without these — install only the extra you need.
#   ebranchformer_espnet  ->  pip install -e ".[espnet]"
#   moonshine_official    ->  pip install -e ".[moonshine]"
espnet = [
    "espnet>=202301",
    "huggingface_hub>=0.20",
]
moonshine = [
    "transformers>=5.17",
    "huggingface_hub>=0.20",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echo*"]
