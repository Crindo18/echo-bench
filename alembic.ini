# Settings for the `alembic` command line, used mainly to create new migrations.
# `echo-bench db init` and `echo-bench db upgrade` do not read this file.
#
# Typical workflow for a new migration (for example the M3 data tables):
#   uv run alembic -x db=results/scratch.db upgrade head
#   (edit packages/echo-bench/src/echo_bench/db/models.py)
#   uv run alembic -x db=results/scratch.db revision --autogenerate --rev-id 0002 -m "data tables"
#   (read and fix the generated file, then run the tests)

[alembic]
script_location = packages/echo-bench/src/echo_bench/db/migrations
path_separator = os
echo_db_path = results/scratch.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
