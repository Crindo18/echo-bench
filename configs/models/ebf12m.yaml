# The encoder recipe (blueprint sections 4.4 and 7.2, M1).
# This is the file you edit to refine the model's size and speed:
# change a value, rebuild with `echo-train build-random`, then compare with `echo-bench perf`.
name: ebf-12m
seed: 0                       # random weights are reproducible from this seed
input_size: 80                # mel bins per 10 ms frame; must match the frontend
encoder:
  output_size: 256            # width; parameters grow roughly with width squared
  attention_heads: 4
  num_blocks: 8               # depth; each block adds ~1.4 M parameters (~1.5 MB in INT8)
  cgmlp_linear_units: 1024    # width of the convolution branch
  cgmlp_conv_kernel: 31
  use_ffn: true               # ESPnet's default is false; the blueprint's size estimate assumes true
  macaron_ffn: true
  linear_units: 512           # feed-forward width
  merge_conv_kernel: 3
  input_layer: conv2d         # shrinks time 4x before the blocks
  max_pos_emb_len: 500        # ESPnet's default (5000) adds a 10 MB table to the file; 500 covers ~20 s
embedding:
  pooling: masked_mean
  l2_normalized: false
export:
  opset: 17
  trace_length_s: 3
  parity_lengths_s: [1, 2, 3, 5, 8, 10]   # includes lengths the export never saw (gate G2a)
  parity_tolerance: 1.0e-4
quantization:
  methods: [dynamic, static_qdq]          # which INT8 versions build-random makes
  per_channel: true
  calibration:                            # used by static_qdq only
    n_utts: 16
    method: MinMax
    source: synthetic                     # M1 only. From M4: TRAINING speakers' audio only (rule L3)
