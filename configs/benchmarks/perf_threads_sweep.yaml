# Thread x spinning sweep for choosing the Pi setting (blueprint section 6.1, M2).
# Pick on p95 AND temperature: spinning lowers latency but burns CPU and heat.
kind: perf
models:
  - ebf-12m-rand:onnx_int8_static
input_durations_s: [1, 3, 8]
warmup_iters: 20
measure_iters: 300
block_size: 50
cooldown_below_c: 60.0
cooldown_max_wait_s: 300
ort:
  intra_op_threads: [1, 2, 3, 4]
  allow_spinning: [true, false]
monitor:
  sample_hz: 10
