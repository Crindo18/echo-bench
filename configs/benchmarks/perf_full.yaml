# The full latency protocol (blueprint section 6.1). Use for numbers that go in the thesis.
kind: perf
models:
  - ebf-12m-rand:onnx_fp32
  - ebf-12m-rand:onnx_int8_dynamic
  - ebf-12m-rand:onnx_int8_static
input_durations_s: [1, 2, 3, 5, 8]
warmup_iters: 20
measure_iters: 300
block_size: 50
cooldown_below_c: 60.0        # burst regime: before each block, wait until the SoC is below 60 C (Pi)
cooldown_max_wait_s: 300
ort:
  intra_op_threads: [4]
  allow_spinning: [true]
monitor:
  sample_hz: 10
