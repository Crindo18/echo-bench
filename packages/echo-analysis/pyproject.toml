[project]
name = "echo-analysis"
version = "0.1.0"
description = "Statistics, figures and thesis tables. Desktop only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "echo-bench",
    "pandas>=3.0,<3.1",
    "matplotlib>=3.11,<3.12",
    "scikit-learn>=1.9,<1.10",  # StratifiedGroupKFold for the CV plan (M3)
    # Added later: scipy and pingouin (M5-M9), statsmodels, openpyxl (M9).
]

# Adds `echo-bench report ...` on machines where this package is installed (the desktop).
# echo-bench finds it through this entry point and never imports echo_analysis itself.
[project.entry-points."echo_bench.plugins"]
report = "echo_analysis.report:app"
cv = "echo_analysis.cv:app"

[tool.uv.sources]
echo-bench = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
