[project]
name = "echo-core"
version = "0.1.0"
description = "The code that ships on the ECHO device. Never imports torch, espnet, librosa or pandas."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<2.6",
    "onnxruntime==1.30.0",  # pinned exactly: the same runtime must run on the desktop and the Pi
    "pydantic>=2.13,<2.14",
    # Added in later milestones: soundfile, soxr, scipy (M4-M8), kaldi-native-fbank (only
    # if training uses Kaldi fbank, ADR-3), piper-tts, sounddevice, gpiozero (M8).
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
